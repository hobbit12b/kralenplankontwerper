<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kralenplank ontwerper</title>
  <style>
    :root{
      --bg:#f6f7fb;
      --panel:#ffffff;
      --ink:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --shadow: 0 10px 30px rgba(0,0,0,.08);
      --radius: 16px;
    }
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background: var(--bg);
      color: var(--ink);
    }
    .wrap{
      max-width: 1100px;
      margin: 18px auto;
      padding: 0 14px 22px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 14px;
    }
    .card{
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    header.card{
      grid-column: 1 / -1;
      padding: 14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    header h1{
      margin:0;
      font-size: 18px;
      letter-spacing: .2px;
    }
    header .hint{
      color: var(--muted);
      font-size: 13px;
    }

    .panel{ padding: 14px; }
    .section{
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      margin-bottom: 12px;
    }
    .section h2{
      margin:0 0 10px;
      font-size: 14px;
    }
    .grid2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    label{
      font-size: 13px;
      color: var(--muted);
    }
    select, input[type="range"]{
      width: 100%;
      border:1px solid var(--line);
      border-radius: 12px;
      padding: 10px 10px;
      font-size: 14px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }
    input[type="range"]{ padding: 10px 0; }

    .btns{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    button{
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 14px;
      cursor: pointer;
    }
    button.primary{
      background: #111827;
      color: #fff;
      border-color: #111827;
    }
    button.danger{
      background:#fff;
      border-color:#fecaca;
      color:#991b1b;
    }
    button:active{ transform: translateY(1px); }

    .palette{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .swatch{
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 10px;
      display:flex;
      align-items:center;
      gap: 10px;
      cursor:pointer;
      user-select:none;
      background:#fff;
    }
    .dot{
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.15);
      flex: 0 0 auto;
    }
    .swatch span{
      font-size: 13px;
      line-height: 1.1;
    }
    .swatch.active{
      outline: 3px solid rgba(17,24,39,.2);
      border-color: rgba(17,24,39,.4);
    }

    .stage{
      padding: 14px;
      display:flex;
      flex-direction: column;
      gap: 12px;
    }
    .canvasWrap{
      border: 1px solid var(--line);
      border-radius: 18px;
      background:#fff;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.02);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 12px;
      overflow:auto;
    }
    canvas{
      max-width: 100%;
      height: auto;
      touch-action: none;
    }
    .status{
      display:flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .pill{
      border:1px solid var(--line);
      padding: 6px 10px;
      border-radius: 999px;
      background:#fff;
      color: var(--ink);
      font-size: 13px;
    }

    @media (max-width: 920px){
      .wrap{ grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="card">
      <div>
        <h1>Kralenplank ontwerper</h1>
        <div class="hint">Tik of klik om kralen te plaatsen, houd ingedrukt om door te tekenen</div>
      </div>
      <div class="pill" id="saveState">Niet opgeslagen</div>
    </header>

    <aside class="card panel">
      <div class="section">
        <h2>Plankinstellingen</h2>
        <div class="grid2">
          <div>
            <label for="sizeSelect">Aantal pinnen (vierkant)</label>
            <select id="sizeSelect">
              <option value="15">15 × 15</option>
              <option value="19" selected>19 × 19</option>
              <option value="21">21 × 21</option>
              <option value="29">29 × 29</option>
            </select>
          </div>
          <div>
            <label for="beadScale">Kraalformaat</label>
            <input id="beadScale" type="range" min="16" max="34" value="24" />
          </div>
        </div>

        <div class="btns">
          <button id="lockBtn" class="primary" title="Zet het formaat vast zodat het per ongeluk niet verandert">Formaat vastzetten</button>
          <button id="clearBtn" class="danger">Leegmaken</button>
        </div>
      </div>

      <div class="section">
        <h2>Gereedschap</h2>
        <div class="btns">
          <button id="undoBtn">Undo</button>
          <button id="eraserBtn">Gum</button>
        </div>
        <div class="btns">
          <button id="saveBtn" class="primary">Opslaan</button>
          <button id="loadBtn">Laden</button>
        </div>
        <div class="btns">
          <button id="exportBtn">Export als PNG</button>
          <button id="printBtn">Print</button>
        </div>
      </div>

      <div class="section">
        <h2>Kleuren (jullie set)</h2>
        <div class="palette" id="palette"></div>
      </div>
    </aside>

    <main class="card stage">
      <div class="status">
        <div class="pill" id="activeColorPill">Kleur: wit</div>
        <div class="pill" id="countPill">Geplaatst: 0</div>
      </div>
      <div class="canvasWrap">
        <canvas id="board" width="900" height="900" aria-label="kralenplank"></canvas>
      </div>
      <div class="status">
        <div>Tip: gum schakelt tekenen uit, tik op een geplaatste kraal om die weg te halen</div>
        <div id="modePill" class="pill">Modus: tekenen</div>
      </div>
    </main>
  </div>

  <script>
  (() => {
    const COLORS = [
      { name: "wit", hex: "#ffffff" },
      { name: "zwart", hex: "#111111" },
      { name: "rood", hex: "#e11d48" },
      { name: "geel", hex: "#facc15" },
      { name: "lichtblauw", hex: "#38bdf8" },
      { name: "donkerblauw", hex: "#1d4ed8" },
      { name: "roze", hex: "#fb7185" },
      { name: "oranje", hex: "#fb923c" },
      { name: "groen", hex: "#22c55e" },
      { name: "donker paars", hex: "#6d28d9" },
      { name: "lichtpaars", hex: "#a78bfa" },
      { name: "bruin", hex: "#8b5a2b" },
    ];

    const el = (id) => document.getElementById(id);

    const canvas = el("board");
    const ctx = canvas.getContext("2d");

    const sizeSelect = el("sizeSelect");
    const beadScale = el("beadScale");
    const paletteEl = el("palette");
    const clearBtn = el("clearBtn");
    const undoBtn = el("undoBtn");
    const eraserBtn = el("eraserBtn");
    const exportBtn = el("exportBtn");
    const printBtn = el("printBtn");
    const saveBtn = el("saveBtn");
    const loadBtn = el("loadBtn");
    const lockBtn = el("lockBtn");

    const activeColorPill = el("activeColorPill");
    const countPill = el("countPill");
    const modePill = el("modePill");
    const saveState = el("saveState");

    const STORAGE_KEY = "kralenplank_designer_v1";

    let gridN = Number(sizeSelect.value);
    let beadPx = Number(beadScale.value);
    let locked = false;

    let activeColor = COLORS[0];
    let eraserMode = false;

    let grid = makeGrid(gridN);
    let history = [];

    const swatchByName = new Map();

    function makeGrid(n){
      return Array.from({length:n}, () => Array.from({length:n}, () => null));
    }

    function snapshot(){
      return grid.map(row => row.slice());
    }

    function pushHistory(){
      history.push(snapshot());
      if(history.length > 60) history.shift();
    }

    function setSaved(flag){
      saveState.textContent = flag ? "Opgeslagen" : "Niet opgeslagen";
    }

    function setActiveColor(color){
      activeColor = color;
      eraserMode = false;
      modePill.textContent = "Modus: tekenen";
      eraserBtn.classList.toggle("primary", false);
      activeColorPill.textContent = "Kleur: " + color.name;

      for(const swatch of swatchByName.values()){
        swatch.classList.remove("active");
      }
      const activeSwatch = swatchByName.get(color.name);
      if(activeSwatch) activeSwatch.classList.add("active");
    }

    function buildPalette(){
      paletteEl.innerHTML = "";
      swatchByName.clear();

      COLORS.forEach((c, idx) => {
        const item = document.createElement("div");
        item.className = "swatch" + (idx === 0 ? " active" : "");
        item.innerHTML = `
          <div class="dot" style="background:${c.hex}"></div>
          <span>${c.name}</span>
        `;
        item.addEventListener("click", () => setActiveColor(c));
        paletteEl.appendChild(item);
        swatchByName.set(c.name, item);
      });
    }

    function boardMetrics(){
      const n = gridN;
      const padding = Math.round(beadPx * 1.25);
      const spacing = beadPx * 1.65;
      const w = Math.round(padding * 2 + (n - 1) * spacing);
      return { n, padding, spacing, w, h: w };
    }

    function resizeCanvasToFit(){
      const m = boardMetrics();
      canvas.width = m.w;
      canvas.height = m.h;
    }

    function roundRect(ctx, x, y, w, h, r){
      const rr = Math.min(r, w/2, h/2);
      ctx.beginPath();
      ctx.moveTo(x+rr,y);
      ctx.arcTo(x+w,y, x+w,y+h, rr);
      ctx.arcTo(x+w,y+h, x,y+h, rr);
      ctx.arcTo(x,y+h, x,y, rr);
      ctx.arcTo(x,y, x+w,y, rr);
      ctx.closePath();
    }

    function drawBead(x, y, colorHex){
      const R = beadPx * 0.52;
      const hole = beadPx * 0.16;

      ctx.beginPath();
      ctx.fillStyle = "rgba(0,0,0,.12)";
      ctx.arc(x + R*0.12, y + R*0.18, R*1.02, 0, Math.PI*2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = colorHex;
      ctx.arc(x, y, R, 0, Math.PI*2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = "rgba(255,255,255,.22)";
      ctx.arc(x - R*0.25, y - R*0.25, R*0.55, 0, Math.PI*2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = "rgba(0,0,0,.35)";
      ctx.arc(x, y, hole, 0, Math.PI*2);
      ctx.fill();
    }

    function draw(){
      resizeCanvasToFit();
      const m = boardMetrics();

      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0,0,canvas.width,canvas.height);

      ctx.strokeStyle = "#e5e7eb";
      ctx.lineWidth = 2;
      roundRect(ctx, 6, 6, canvas.width - 12, canvas.height - 12, 18);
      ctx.stroke();

      for(let r=0;r<m.n;r++){
        for(let c=0;c<m.n;c++){
          const x = m.padding + c*m.spacing;
          const y = m.padding + r*m.spacing;

          ctx.beginPath();
          ctx.fillStyle = "#111827";
          ctx.globalAlpha = 0.18;
          ctx.arc(x,y, Math.max(1.6, beadPx*0.12), 0, Math.PI*2);
          ctx.fill();
          ctx.globalAlpha = 1;

          const bead = grid[r][c];
          if(bead){
            drawBead(x, y, bead);
          }
        }
      }
    }

    function updateCounts(){
      let count = 0;
      for(const row of grid){
        for(const cell of row){
          if(cell) count++;
        }
      }
      countPill.textContent = "Geplaatst: " + count;
    }

    function screenToCell(px, py){
      const rect = canvas.getBoundingClientRect();
      const x = (px - rect.left) * (canvas.width / rect.width);
      const y = (py - rect.top) * (canvas.height / rect.height);

      const m = boardMetrics();
      const col = Math.round((x - m.padding) / m.spacing);
      const row = Math.round((y - m.padding) / m.spacing);

      if(row < 0 || col < 0 || row >= m.n || col >= m.n) return null;

      const cx = m.padding + col*m.spacing;
      const cy = m.padding + row*m.spacing;
      const dist = Math.hypot(x - cx, y - cy);
      if(dist > beadPx * 0.85) return null;

      return { row, col };
    }

    function paintCell(row, col){
      const current = grid[row][col];
      const next = eraserMode ? null : activeColor.hex;

      if(current === next){
        grid[row][col] = null;
      } else {
        grid[row][col] = next;
      }

      setSaved(false);
      draw();
      updateCounts();
    }

    let isDown = false;
    let lastCellKey = "";
    let lastPointerId = null;

    function onPointerDown(e){
      e.preventDefault();
      isDown = true;
      lastPointerId = e.pointerId;
      pushHistory();

      const cell = screenToCell(e.clientX, e.clientY);
      if(cell){
        lastCellKey = cell.row + "," + cell.col;
        paintCell(cell.row, cell.col);
      }
      canvas.setPointerCapture(e.pointerId);
    }

    function onPointerMove(e){
      if(!isDown) return;
      if(lastPointerId !== null && e.pointerId !== lastPointerId) return;

      e.preventDefault();
      const cell = screenToCell(e.clientX, e.clientY);
      if(!cell) return;

      const key = cell.row + "," + cell.col;
      if(key === lastCellKey) return;
      lastCellKey = key;

      paintCell(cell.row, cell.col);
    }

    function onPointerUp(e){
      isDown = false;
      lastCellKey = "";
      lastPointerId = null;
      try{ canvas.releasePointerCapture(e.pointerId); } catch {}
    }

    function clearAll(){
      pushHistory();
      grid = makeGrid(gridN);
      setSaved(false);
      draw();
      updateCounts();
    }

    function undo(){
      const prev = history.pop();
      if(!prev) return;
      grid = prev.map(r => r.slice());
      setSaved(false);
      draw();
      updateCounts();
    }

    function save(){
      const payload = { v: 1, gridN, beadPx, locked, grid };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      setSaved(true);
    }

    function load({ silent = false } = {}){
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw){
        if(!silent) alert("Nog niets opgeslagen");
        return false;
      }

      let payload;
      try{ payload = JSON.parse(raw); }
      catch {
        if(!silent) alert("Opslag is beschadigd");
        return false;
      }

      if(payload && payload.grid && payload.gridN){
        gridN = Number(payload.gridN);
        beadPx = Number(payload.beadPx || beadPx);
        locked = Boolean(payload.locked);

        sizeSelect.value = String(gridN);
        beadScale.value = String(beadPx);

        sizeSelect.disabled = locked;
        lockBtn.textContent = locked ? "Formaat staat vast" : "Formaat vastzetten";
        lockBtn.classList.toggle("primary", !locked);

        grid = payload.grid;
        history = [];
        setSaved(true);
        draw();
        updateCounts();
        return true;
      }

      if(!silent) alert("Opslag heeft een onbekend formaat");
      return false;
    }

    function exportPNG(){
      draw();
      const url = canvas.toDataURL("image/png");
      const a = document.createElement("a");
      a.href = url;
      a.download = `kralenplank_${gridN}x${gridN}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function printBoard(){
  draw();
  const url = canvas.toDataURL("image/png");
  const w = window.open("", "_blank");
  if(!w) return alert("Pop up geblokkeerd, sta pop ups toe voor printen");

  w.document.open();
  w.document.write(`
    <html>
      <head>
        <title>Print kralenplank</title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <style>
          body{margin:0;display:flex;align-items:center;justify-content:center;background:#fff}
          img{max-width:95vw;max-height:95vh}
        </style>
      </head>
      <body>
        <img id="img" src="${url}" alt="kralenplank" />
      </body>
    </html>
  `);
  w.document.close();

  const img = w.document.getElementById("img");
  const tryPrint = () => {
    try { w.focus(); w.print(); } catch {}
  };

  if(img){
    img.onload = () => tryPrint();
    img.onerror = () => tryPrint();
  } else {
    setTimeout(() => tryPrint(), 250);
  }
}

    function toggleEraser(){
      eraserMode = !eraserMode;
      modePill.textContent = eraserMode ? "Modus: gum" : "Modus: tekenen";
      eraserBtn.classList.toggle("primary", eraserMode);
    }

    function lockSize(){
      locked = !locked;
      sizeSelect.disabled = locked;
      lockBtn.textContent = locked ? "Formaat staat vast" : "Formaat vastzetten";
      lockBtn.classList.toggle("primary", !locked);
      setSaved(false);
    }

    sizeSelect.addEventListener("change", () => {
      if(locked) return;
      gridN = Number(sizeSelect.value);
      history = [];
      grid = makeGrid(gridN);
      setSaved(false);
      draw();
      updateCounts();
    });

    beadScale.addEventListener("input", () => {
      beadPx = Number(beadScale.value);
      setSaved(false);
      draw();
    });

    clearBtn.addEventListener("click", clearAll);
    undoBtn.addEventListener("click", undo);
    eraserBtn.addEventListener("click", toggleEraser);
    exportBtn.addEventListener("click", exportPNG);
    printBtn.addEventListener("click", printBoard);
    saveBtn.addEventListener("click", save);
    loadBtn.addEventListener("click", () => load({ silent: false }));
    lockBtn.addEventListener("click", lockSize);

    canvas.addEventListener("pointerdown", onPointerDown, { passive: false });
    canvas.addEventListener("pointermove", onPointerMove, { passive: false });
    canvas.addEventListener("pointerup", onPointerUp);
    canvas.addEventListener("pointercancel", onPointerUp);

    buildPalette();
    draw();
    updateCounts();

    load({ silent: true });
  })();
  </script>
</body>
</html>
