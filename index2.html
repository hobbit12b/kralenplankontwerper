<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kralenplankontwerper</title>
  <link rel="icon" href="data:," />
  <style>
    :root{
      --bg:#f6f7fb;
      --panel:#ffffff;
      --ink:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --shadow: 0 10px 24px rgba(0,0,0,.08);
      --radius: 16px;
    }

    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: var(--bg);
      color: var(--ink);
    }

    .topbar{
      max-width: 1100px;
      margin: 14px auto 0;
      padding: 10px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }

    .card{
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .brand{
      font-weight: 800;
      font-size: 18px;
      letter-spacing: .2px;
      white-space: nowrap;
    }

    .titleInput{
      flex: 1 1 auto;
      max-width: 560px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 12px;
      font-size: 16px;
      outline: none;
      background:#fff;
    }

    .wrap{
      max-width: 1100px;
      margin: 12px auto 14px;
      padding: 0 14px 18px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 14px;
    }

    .panel{ padding: 14px; }

    .section{
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      margin-bottom: 12px;
    }

    input[type="range"]{
      width: 100%;
      border:1px solid var(--line);
      border-radius: 14px;
      padding: 10px 0;
      background: #fff;
      outline: none;
    }

    .btns2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btns3{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    button{
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 18px;
      padding: 14px 12px;
      font-size: 24px;
      cursor: pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: 58px;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }

    button.primary{
      background: #111827;
      color: #fff;
      border-color: #111827;
    }

    button.danger{
      border-color:#fecaca;
      color:#991b1b;
      background:#fff;
    }

    button:active{ transform: translateY(1px); }

    .palette{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .swatch{
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      background:#fff;
      min-height: 58px;
      -webkit-tap-highlight-color: transparent;
    }

    .swatch.active{
      outline: 4px solid rgba(17,24,39,.18);
      border-color: rgba(17,24,39,.4);
    }

    .dot{
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.15);
      flex: 0 0 auto;
      position: relative;
      box-shadow: inset 0 2px 4px rgba(255,255,255,.25);
    }

    .dot::after{
      content:"";
      position:absolute;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.28);
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
    }

    .stage{
      padding: 14px;
      display:flex;
      flex-direction: column;
    }

    .canvasWrap{
      border: 1px solid var(--line);
      border-radius: 18px;
      background:#fff;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.02);
      display:flex;
      align-items:flex-start;
      justify-content:flex-start;
      padding: 12px;
      overflow:auto;
    }

    canvas{
      max-width: 100%;
      height: auto;
      touch-action: none;
      transform-origin: top left;
    }

    .zoomBar{
      margin-top: 12px;
      display:flex;
      align-items:center;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background:#fff;
    }

    .zoomBar input[type="range"]{
      flex: 1 1 auto;
      margin: 0;
    }

    .zoomPct{
      min-width: 64px;
      text-align: right;
      font-weight: 800;
    }

    @media (max-width: 920px){
      .wrap{ grid-template-columns: 1fr; }
      .dot{ width: 34px; height: 34px; }
      button{ min-height: 54px; font-size: 22px; }
    }
  </style>
</head>
<body>
  <header class="card topbar">
    <div class="brand">Kralenplankontwerper</div>
    <input id="designTitle" class="titleInput" type="text" placeholder="Titel" aria-label="Titel" />
  </header>

  <div class="wrap">
    <aside class="card panel">
      <div class="section">
        <input id="beadScale" type="range" min="18" max="34" value="28" aria-label="Kraalformaat" />

        <div class="btns2" style="margin-top:10px">
          <button id="undoBtn" aria-label="Undo">↩️</button>
          <button id="clearBtn" class="danger" aria-label="Leegmaken">🧽</button>
        </div>

        <div class="btns3">
          <button id="eraserBtn" aria-label="Gum">🧼</button>
          <button id="saveBtn" class="primary" aria-label="Opslaan">💾</button>
          <button id="loadBtn" aria-label="Laden">📂</button>
        </div>

        <div class="btns3">
          <button id="importBtn" aria-label="Importeer foto">📷</button>
          <button id="importModeBtn" aria-label="Import modus">🧩</button>
          <button id="printBtn" aria-label="Print">🖨️</button>
        </div>

        <div class="btns3">
          <button id="exportBtn" aria-label="Afbeelding">🖼️</button>
          <button id="homeBtn" aria-label="Nieuw">🆕</button>
          <button id="helpBtn" aria-label="Help">❔</button>
        </div>

        <input id="fileInput" type="file" accept="image/*" style="display:none" />
      </div>

      <div class="section">
        <div class="palette" id="palette" aria-label="Kleuren"></div>
      </div>
    </aside>

    <main class="card stage">
      <div class="canvasWrap">
        <canvas id="board" width="900" height="900" aria-label="kralenplank"></canvas>
      </div>

      <div class="zoomBar" aria-label="Zoom">
        <button id="zoomOutBtn" aria-label="Uitzoomen">➖</button>
        <input id="zoomRange" type="range" min="0.25" max="2.5" step="0.05" value="1" aria-label="Zoom" />
        <button id="zoomInBtn" aria-label="Inzoomen">➕</button>
        <button id="zoomResetBtn" aria-label="Zoom 100">🔎</button>
        <div class="zoomPct" id="zoomPct" aria-hidden="true">100%</div>
      </div>
    </main>
  </div>

  <script>
  (() => {
    const FIXED_GRID = 19;

    const COLORS = [
      { name: "wit", hex: "#ffffff" },
      { name: "zwart", hex: "#111111" },
      { name: "rood", hex: "#e11d48" },
      { name: "geel", hex: "#facc15" },
      { name: "lichtblauw", hex: "#38bdf8" },
      { name: "donkerblauw", hex: "#1d4ed8" },
      { name: "roze", hex: "#fb7185" },
      { name: "oranje", hex: "#fb923c" },
      { name: "groen", hex: "#22c55e" },
      { name: "donker paars", hex: "#6d28d9" },
      { name: "lichtpaars", hex: "#a78bfa" },
      { name: "bruin", hex: "#8b5a2b" },
    ];

    const el = (id) => document.getElementById(id);

    const canvas = el("board");
    const ctx = canvas.getContext("2d");

    const designTitleInput = el("designTitle");
    const beadScale = el("beadScale");
    const paletteEl = el("palette");

    const clearBtn = el("clearBtn");
    const undoBtn = el("undoBtn");
    const eraserBtn = el("eraserBtn");
    const exportBtn = el("exportBtn");
    const printBtn = el("printBtn");
    const saveBtn = el("saveBtn");
    const loadBtn = el("loadBtn");
    const homeBtn = el("homeBtn");

    const importBtn = el("importBtn");
    const importModeBtn = el("importModeBtn");
    const fileInput = el("fileInput");

    const zoomRange = el("zoomRange");
    const zoomOutBtn = el("zoomOutBtn");
    const zoomInBtn = el("zoomInBtn");
    const zoomResetBtn = el("zoomResetBtn");
    const zoomPct = el("zoomPct");

    const helpBtn = el("helpBtn");

    const STORAGE_KEY = "kralenplank_designer_v6";

    let gridN = FIXED_GRID;
    let beadPx = Number(beadScale.value);
    let zoom = 1;

    let activeColor = COLORS[0];
    let eraserMode = false;

    // Import modus
    // simple: rustiger, herkenbaarder
    // detailed: meer kleuren
    let importMode = localStorage.getItem(STORAGE_KEY + "_importMode") || "simple";
    if(!["simple","detailed","silhouette"].includes(importMode)) importMode = "simple";
    setImportModeUI();

    let grid = makeGrid(gridN);
    let history = [];

    const swatches = [];

    function makeGrid(n){
      return Array.from({length:n}, () => Array.from({length:n}, () => null));
    }

    function snapshot(){
      return grid.map(row => row.slice());
    }

    function pushHistory(){
      history.push(snapshot());
      if(history.length > 80) history.shift();
    }

    function setActiveColor(color){
      activeColor = color;
      eraserMode = false;
      eraserBtn.classList.remove("primary");

      for(const s of swatches) s.classList.remove("active");
      const found = swatches.find(x => x.dataset.name === color.name);
      if(found) found.classList.add("active");
    }

    function buildPalette(){
      paletteEl.innerHTML = "";
      swatches.length = 0;

      COLORS.forEach((c, idx) => {
        const item = document.createElement("div");
        item.className = "swatch" + (idx === 0 ? " active" : "");
        item.dataset.name = c.name;

        const dot = document.createElement("div");
        dot.className = "dot";
        dot.style.background = c.hex;

        item.appendChild(dot);
        item.addEventListener("click", () => setActiveColor(c));

        paletteEl.appendChild(item);
        swatches.push(item);
      });
    }

    function hexToRgb(hex){
      const h = hex.replace("#", "");
      const v = parseInt(h, 16);
      return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
    }

    const PALETTE_RGB = COLORS.map(c => ({ name: c.name, hex: c.hex, ...hexToRgb(c.hex) }));
    const BLACK_HEX = "#111111";

    function nearestFromList(r, g, b, list){
      let best = list[0];
      let bestD = Infinity;
      for(const c of list){
        const dr = r - c.r;
        const dg = g - c.g;
        const db = b - c.b;
        const d = dr*dr + dg*dg + db*db;
        if(d < bestD){ bestD = d; best = c; }
      }
      return best.hex;
    }

    function nearestPaletteHex(r, g, b){
      return nearestFromList(r, g, b, PALETTE_RGB);
    }

    function boardMetrics(){
      const n = gridN;
      const spacing = beadPx * 1.12;
      const padding = beadPx * 0.95;
      const w = Math.round(padding * 2 + (n - 1) * spacing);
      return { n, padding, spacing, w, h: w };
    }

    function resizeCanvasToFit(){
      const m = boardMetrics();
      canvas.width = m.w;
      canvas.height = m.h;
    }

    function applyZoom(){
      canvas.style.transform = `scale(${zoom})`;
      zoomPct.textContent = `${Math.round(zoom * 100)}%`;
    }

    function roundRect(ctx, x, y, w, h, r){
      const rr = Math.min(r, w/2, h/2);
      ctx.beginPath();
      ctx.moveTo(x+rr,y);
      ctx.arcTo(x+w,y, x+w,y+h, rr);
      ctx.arcTo(x+w,y+h, x,y+h, rr);
      ctx.arcTo(x,y+h, x,y, rr);
      ctx.arcTo(x,y, x+w,y, rr);
      ctx.closePath();
    }

    function drawBead(x, y, colorHex){
      const R = beadPx * 0.52;
      const hole = beadPx * 0.14;

      ctx.beginPath();
      ctx.fillStyle = "rgba(0,0,0,.12)";
      ctx.arc(x + R*0.10, y + R*0.16, R*1.02, 0, Math.PI*2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = colorHex;
      ctx.arc(x, y, R, 0, Math.PI*2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = "rgba(255,255,255,.22)";
      ctx.arc(x - R*0.22, y - R*0.22, R*0.52, 0, Math.PI*2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = "rgba(0,0,0,.35)";
      ctx.arc(x, y, hole, 0, Math.PI*2);
      ctx.fill();
    }

    function draw(){
      resizeCanvasToFit();
      const m = boardMetrics();

      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0,0,canvas.width,canvas.height);

      ctx.strokeStyle = "#e5e7eb";
      ctx.lineWidth = 2;
      roundRect(ctx, 6, 6, canvas.width - 12, canvas.height - 12, 18);
      ctx.stroke();

      for(let r=0;r<m.n;r++){
        for(let c=0;c<m.n;c++){
          const x = m.padding + c*m.spacing;
          const y = m.padding + r*m.spacing;

          ctx.beginPath();
          ctx.fillStyle = "#111827";
          ctx.globalAlpha = 0.14;
          ctx.arc(x,y, Math.max(1.6, beadPx*0.10), 0, Math.PI*2);
          ctx.fill();
          ctx.globalAlpha = 1;

          const bead = grid[r][c];
          if(bead) drawBead(x, y, bead);
        }
      }
    }

    function screenToCell(px, py){
      const rect = canvas.getBoundingClientRect();
      const x = (px - rect.left) * (canvas.width / rect.width);
      const y = (py - rect.top) * (canvas.height / rect.height);

      const m = boardMetrics();
      const col = Math.round((x - m.padding) / m.spacing);
      const row = Math.round((y - m.padding) / m.spacing);

      if(row < 0 || col < 0 || row >= m.n || col >= m.n) return null;

      const cx = m.padding + col*m.spacing;
      const cy = m.padding + row*m.spacing;
      const dist = Math.hypot(x - cx, y - cy);
      if(dist > beadPx * 0.78) return null;

      return { row, col };
    }

    function paintCell(row, col){
      const current = grid[row][col];
      const next = eraserMode ? null : activeColor.hex;
      grid[row][col] = (current === next) ? null : next;
      draw();
    }

    let isDown = false;
    let lastCellKey = "";
    let lastPointerId = null;

    function onPointerDown(e){
      e.preventDefault();
      isDown = true;
      lastPointerId = e.pointerId;
      pushHistory();

      const cell = screenToCell(e.clientX, e.clientY);
      if(cell){
        lastCellKey = cell.row + "," + cell.col;
        paintCell(cell.row, cell.col);
      }
      canvas.setPointerCapture(e.pointerId);
    }

    function onPointerMove(e){
      if(!isDown) return;
      if(lastPointerId !== null && e.pointerId !== lastPointerId) return;

      e.preventDefault();
      const cell = screenToCell(e.clientX, e.clientY);
      if(!cell) return;

      const key = cell.row + "," + cell.col;
      if(key === lastCellKey) return;
      lastCellKey = key;

      paintCell(cell.row, cell.col);
    }

    function onPointerUp(e){
      isDown = false;
      lastCellKey = "";
      lastPointerId = null;
      try{ canvas.releasePointerCapture(e.pointerId); } catch {}
    }

    function clearAll(){
      pushHistory();
      grid = makeGrid(gridN);
      draw();
    }

    function undo(){
      const prev = history.pop();
      if(!prev) return;
      grid = prev.map(r => r.slice());
      draw();
    }

    function toggleEraser(){
      eraserMode = !eraserMode;
      eraserBtn.classList.toggle("primary", eraserMode);
    }

    function save(){
      const title = (designTitleInput.value || "").trim();
      const payload = { v: 6, title, gridN, beadPx, grid, importMode };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      try{ localStorage.setItem(STORAGE_KEY + "_title", title); } catch {}
      try{ localStorage.setItem(STORAGE_KEY + "_importMode", importMode); } catch {}
    }

    function load(){
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return false;

      let payload;
      try{ payload = JSON.parse(raw); }
      catch { return false; }

      if(payload && payload.grid && payload.gridN === FIXED_GRID){
        beadPx = Number(payload.beadPx || beadPx);
        beadScale.value = String(beadPx);
        grid = payload.grid;
        history = [];
        if(typeof payload.title === "string") designTitleInput.value = payload.title;
        if(typeof payload.importMode === "string") importMode = payload.importMode;
        setImportModeUI();
        draw();
        return true;
      }
      return false;
    }

    function safeFileBase(){
      const rawTitle = (designTitleInput.value || "").trim();
      const base = rawTitle ? rawTitle : `kralenplank_${gridN}x${gridN}`;
      return base.toLowerCase().replace(/[^a-z0-9à-ž]+/gi, "_").replace(/^_+|_+$/g, "");
    }

    function exportPNG(){
      draw();
      const url = canvas.toDataURL("image/png");
      const a = document.createElement("a");
      a.href = url;
      a.download = `${safeFileBase()}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function printBoard(){
      draw();
      const url = canvas.toDataURL("image/png");
      const w = window.open("", "_blank");
      if(!w) return;

      const title = (designTitleInput.value || "").trim() || "Kralenplankontwerper";

      w.document.open();
      w.document.write(`
        <html>
          <head>
            <title>${title}</title>
            <meta name="viewport" content="width=device-width,initial-scale=1" />
            <style>
              body{margin:0;background:#fff;color:#111827;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
              .page{padding:18px}
              h1{margin:0 0 12px;font-size:20px}
              img{max-width:100%;height:auto;border:1px solid #e5e7eb;border-radius:12px}
            </style>
          </head>
          <body>
            <div class="page">
              <h1>${title}</h1>
              <img id="img" src="${url}" alt="kralenplank" />
            </div>
          </body>
        </html>
      `);
      w.document.close();

      const img = w.document.getElementById("img");
      const tryPrint = () => {
        try { w.focus(); w.print(); } catch {}
      };

      if(img){
        img.onload = () => tryPrint();
        img.onerror = () => tryPrint();
      } else {
        setTimeout(() => tryPrint(), 250);
      }
    }

    function newDesign(){
      history = [];
      grid = makeGrid(gridN);
      draw();
    }

    function showHelp(){
      alert([
        "Tekenen: tik of sleep",
        "Gum: druk op 🧼",
        "Foto: druk op 📷",
        "Foto modus: druk op 🧩, ✂️ of 🎨",
        "Tip: zoom uit om het plaatje te herkennen",
      ].join("\n"));
    }

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    function setZoom(v){
      zoom = clamp(v, Number(zoomRange.min), Number(zoomRange.max));
      zoomRange.value = String(zoom);
      applyZoom();
    }

    function setImportModeUI(){
      // 🧩 = simple, 🎨 = detailed, ✂️ = silhouette
      if(importMode === "simple") importModeBtn.textContent = "🧩";
      else if(importMode === "detailed") importModeBtn.textContent = "🎨";
      else importModeBtn.textContent = "✂️";

      try{ localStorage.setItem(STORAGE_KEY + "_importMode", importMode); } catch {}
    } catch {}
    }

    function toggleImportMode(){
      // cycle: simple -> silhouette -> detailed -> simple
      importMode = (importMode === "simple") ? "silhouette" : (importMode === "silhouette") ? "detailed" : "simple";
      setImportModeUI();
    }

    function countNeighbors(gridLocal, r, c){
      const v = gridLocal[r][c];
      if(!v) return 0;
      let n = 0;
      for(let dr=-1; dr<=1; dr++){
        for(let dc=-1; dc<=1; dc++){
          if(dr===0 && dc===0) continue;
          const rr = r + dr;
          const cc = c + dc;
          if(rr<0 || cc<0 || rr>=gridN || cc>=gridN) continue;
          if(gridLocal[rr][cc]) n++;
        }
      }
      return n;
    }

    function dilateBlack(gridLocal){
      const out = gridLocal.map(row => row.slice());
      for(let r=0;r<gridN;r++){
        for(let c=0;c<gridN;c++){
          if(gridLocal[r][c] !== BLACK_HEX) continue;
          for(let dr=-1; dr<=1; dr++){
            for(let dc=-1; dc<=1; dc++){
              const rr = r + dr;
              const cc = c + dc;
              if(rr<0 || cc<0 || rr>=gridN || cc>=gridN) continue;
              if(out[rr][cc] == null) out[rr][cc] = BLACK_HEX;
            }
          }
        }
      }
      return out;
    }

    function pickKeepColorsDiverse(countsMap, maxColors){
      // Herkenbaarheid: niet alleen de grootste vlakken, maar ook kleurvariatie bewaren.
      const entries = Array.from(countsMap.entries()).sort((a,b) => b[1]-a[1]);
      const present = new Set(entries.map(e => e[0]));

      const keep = [];
      if(present.has(BLACK_HEX)) keep.push(BLACK_HEX);

      const rgbByHex = new Map(PALETTE_RGB.map(c => [c.hex, c]));

      // eerste niet zwart, meest voorkomend
      for(const [hex] of entries){
        if(keep.includes(hex)) continue;
        keep.push(hex);
        break;
      }

      const dist2 = (a, b) => {
        const dr = a.r - b.r;
        const dg = a.g - b.g;
        const db = a.b - b.b;
        return dr*dr + dg*dg + db*db;
      };

      while(keep.length < maxColors){
        let bestHex = null;
        let bestScore = -1;

        for(const [hex, cnt] of entries){
          if(keep.includes(hex)) continue;
          const cand = rgbByHex.get(hex);
          if(!cand) continue;

          let minD = Infinity;
          for(const kh of keep){
            const k = rgbByHex.get(kh);
            if(!k) continue;
            minD = Math.min(minD, dist2(cand, k));
          }

          // kleurverschil is hoofdzaak, frequentie helpt mee
          const score = minD + cnt * 120;
          if(score > bestScore){
            bestScore = score;
            bestHex = hex;
          }
        }

        if(!bestHex) break;
        keep.push(bestHex);
      }

      return keep;
    }

    function reducePalette(gridLocal, avgR, avgG, avgB, maxColors){
      const counts = new Map();
      for(let r=0;r<gridN;r++){
        for(let c=0;c<gridN;c++){
          const v = gridLocal[r][c];
          if(!v) continue;
          counts.set(v, (counts.get(v) || 0) + 1);
        }
      }

      if(counts.size === 0) return gridLocal;

      const keep = pickKeepColorsDiverse(counts, maxColors);
      const allowed = PALETTE_RGB.filter(c => keep.includes(c.hex));

      const out = makeGrid(gridN);
      for(let r=0;r<gridN;r++){
        for(let c=0;c<gridN;c++){
          const v = gridLocal[r][c];
          if(!v){ out[r][c] = null; continue; }
          if(keep.includes(v)){
            out[r][c] = v;
            continue;
          }
          out[r][c] = nearestFromList(avgR[r][c], avgG[r][c], avgB[r][c], allowed);
        }
      }

      return out;
    }

    function majoritySmooth(gridLocal, passes){
      // Maakt het raster rustiger, handig voor 19x19.
      let cur = gridLocal.map(row => row.slice());
      const passCount = Math.max(1, passes || 1);

      for(let p=0; p<passCount; p++){
        const out = cur.map(row => row.slice());

        for(let r=0;r<gridN;r++){
          for(let c=0;c<gridN;c++){
            const center = cur[r][c];
            const freq = new Map();

            for(let dr=-1; dr<=1; dr++){
              for(let dc=-1; dc<=1; dc++){
                const rr = r + dr;
                const cc = c + dc;
                if(rr<0 || cc<0 || rr>=gridN || cc>=gridN) continue;
                const v = cur[rr][cc];
                if(!v) continue;
                freq.set(v, (freq.get(v) || 0) + 1);
              }
            }

            if(freq.size === 0){
              out[r][c] = null;
              continue;
            }

            let best = null;
            let bestN = -1;
            for(const [hex, n] of freq.entries()){
              if(n > bestN){ bestN = n; best = hex; }
            }

            if(center === BLACK_HEX){
              out[r][c] = BLACK_HEX;
              continue;
            }

            // als het onrustig is, kies meerderheid
            if(!center && bestN >= 4) out[r][c] = best;
            if(center && bestN >= 5) out[r][c] = best;
          }
        }

        cur = out;
      }

      return cur;
    }

    function despeckle(gridLocal){
      // haal losse spikkels weg, behalve zwart
      const out = gridLocal.map(row => row.slice());
      for(let r=0;r<gridN;r++){
        for(let c=0;c<gridN;c++){
          const v = gridLocal[r][c];
          if(!v) continue;
          if(v === BLACK_HEX) continue;
          const n = countNeighbors(gridLocal, r, c);
          if(n < 2) out[r][c] = null;
        }
      }
      return out;
    }

    function importImageFile(file){
      if(!file) return;

      const url = URL.createObjectURL(file);
      const img = new Image();

      img.onload = () => {
        try{
          pushHistory();

          // Extra resolutie helpt de randdetectie
          const BIG = gridN * 14; // 266
          const off = document.createElement("canvas");
          off.width = BIG;
          off.height = BIG;
          const octx = off.getContext("2d", { willReadFrequently: true });

          // 1) eerst grof vierkant uitsnijden
          const side0 = Math.min(img.width, img.height);
          const sx0 = Math.floor((img.width - side0) / 2);
          const sy0 = Math.floor((img.height - side0) / 2);

          octx.clearRect(0,0,BIG,BIG);
          // klein beetje blur om ruis te verminderen
          octx.filter = (importMode === "simple") ? "blur(0.6px)" : "blur(0.3px)";
          octx.drawImage(img, sx0, sy0, side0, side0, 0, 0, BIG, BIG);
          octx.filter = "none";

          // 2) probeer automatische uitsnede op basis van achtergrond
          // achtergrondkleur: gemiddelde van de hoeken
          const imgData0 = octx.getImageData(0,0,BIG,BIG);
          const d0 = imgData0.data;

          const sampleCorner = (x0, y0) => {
            let sr=0, sg=0, sb=0, n=0;
            const S = Math.max(6, Math.floor(BIG*0.05));
            for(let y=y0; y<y0+S; y++){
              for(let x=x0; x<x0+S; x++){
                const i = (y*BIG + x) * 4;
                sr += d0[i];
                sg += d0[i+1];
                sb += d0[i+2];
                n++;
              }
            }
            return { r: sr/n, g: sg/n, b: sb/n };
          };

          const c1 = sampleCorner(0,0);
          const c2 = sampleCorner(BIG - Math.max(6, Math.floor(BIG*0.05)),0);
          const c3 = sampleCorner(0, BIG - Math.max(6, Math.floor(BIG*0.05)));
          const c4 = sampleCorner(BIG - Math.max(6, Math.floor(BIG*0.05)), BIG - Math.max(6, Math.floor(BIG*0.05)));
          const bg = { r:(c1.r+c2.r+c3.r+c4.r)/4, g:(c1.g+c2.g+c3.g+c4.g)/4, b:(c1.b+c2.b+c3.b+c4.b)/4 };

          const isBg = (r,g,b) => {
            const dr=r-bg.r, dg=g-bg.g, db=b-bg.b;
            const dist = Math.sqrt(dr*dr + dg*dg + db*db);
            const t = (importMode === "detailed") ? 18 : (importMode === "silhouette") ? 30 : 26;
            return dist < t;
          };

          let minX = BIG, minY = BIG, maxX = -1, maxY = -1;
          for(let y=0;y<BIG;y++){
            for(let x=0;x<BIG;x++){
              const i = (y*BIG + x) * 4;
              const r = d0[i], g = d0[i+1], b = d0[i+2], a = d0[i+3];
              if(a < 10) continue;
              if(isBg(r,g,b)) continue;
              if(x < minX) minX = x;
              if(y < minY) minY = y;
              if(x > maxX) maxX = x;
              if(y > maxY) maxY = y;
            }
          }

          // fallback als bbox niet gevonden
          if(maxX < 0){
            minX = 0; minY = 0; maxX = BIG-1; maxY = BIG-1;
          }

          // marge rondom onderwerp, zodat het niet te strak wordt
          const pad = Math.round(BIG * 0.06);
          minX = clamp(minX - pad, 0, BIG-1);
          minY = clamp(minY - pad, 0, BIG-1);
          maxX = clamp(maxX + pad, 0, BIG-1);
          maxY = clamp(maxY + pad, 0, BIG-1);

          const bw = Math.max(1, maxX - minX + 1);
          const bh = Math.max(1, maxY - minY + 1);
          const side = Math.max(bw, bh);
          const cx = minX + bw/2;
          const cy = minY + bh/2;

          const sx = clamp(Math.round(cx - side/2), 0, BIG - side);
          const sy = clamp(Math.round(cy - side/2), 0, BIG - side);

          // 3) herteken naar clean canvas (nog iets blur)
          const clean = document.createElement("canvas");
          clean.width = BIG;
          clean.height = BIG;
          const cctx = clean.getContext("2d", { willReadFrequently: true });
          cctx.filter = (importMode === "simple") ? "blur(0.4px)" : "blur(0.2px)";
          cctx.drawImage(off, sx, sy, side, side, 0, 0, BIG, BIG);
          cctx.filter = "none";

          const imgData = cctx.getImageData(0,0,BIG,BIG);
          const d = imgData.data;

          // contrast boost, maar niet te agressief
          const contrast = (importMode === "simple") ? 1.28 : 1.15;
          const intercept = 128 * (1 - contrast);
          for(let i=0;i<d.length;i+=4){
            d[i]   = clamp(Math.round(d[i]   * contrast + intercept), 0, 255);
            d[i+1] = clamp(Math.round(d[i+1] * contrast + intercept), 0, 255);
            d[i+2] = clamp(Math.round(d[i+2] * contrast + intercept), 0, 255);
          }

          // sobel edge detect
          const gray = new Uint8ClampedArray(BIG*BIG);
          for(let y=0;y<BIG;y++){
            for(let x=0;x<BIG;x++){
              const i = (y*BIG + x) * 4;
              gray[y*BIG + x] = (d[i]*0.2126 + d[i+1]*0.7152 + d[i+2]*0.0722) | 0;
            }
          }

          const edges = new Uint8ClampedArray(BIG*BIG);
          const EDGE_T = (importMode === "detailed") ? 190 : (importMode === "silhouette") ? 165 : 150;
          for(let y=1;y<BIG-1;y++){
            for(let x=1;x<BIG-1;x++){
              const a00 = gray[(y-1)*BIG + (x-1)];
              const a01 = gray[(y-1)*BIG + (x)];
              const a02 = gray[(y-1)*BIG + (x+1)];
              const a10 = gray[(y)*BIG + (x-1)];
              const a12 = gray[(y)*BIG + (x+1)];
              const a20 = gray[(y+1)*BIG + (x-1)];
              const a21 = gray[(y+1)*BIG + (x)];
              const a22 = gray[(y+1)*BIG + (x+1)];

              const gx = (-a00 + a02) + (-2*a10 + 2*a12) + (-a20 + a22);
              const gy = (-a00 - 2*a01 - a02) + (a20 + 2*a21 + a22);
              const mag = Math.abs(gx) + Math.abs(gy);

              edges[y*BIG + x] = mag > EDGE_T ? 255 : 0;
            }
          }

          const cell = BIG / gridN;
          let next = makeGrid(gridN);

          const avgR = makeGrid(gridN);
          const avgG = makeGrid(gridN);
          const avgB = makeGrid(gridN);

          const WHITE_T = (importMode === "detailed") ? 246 : (importMode === "silhouette") ? 220 : 232;
          const EDGE_RATIO_T = (importMode === "detailed") ? 0.24 : (importMode === "silhouette") ? 0.12 : 0.15;

          for(let r=0;r<gridN;r++){
            for(let c=0;c<gridN;c++){
              const x0 = Math.floor(c * cell);
              const y0 = Math.floor(r * cell);
              const x1 = Math.floor((c+1) * cell);
              const y1 = Math.floor((r+1) * cell);

              let sr=0, sg=0, sb=0, n=0;
              let edgeCount=0, tot=0;

              for(let y=y0;y<y1;y++){
                for(let x=x0;x<x1;x++){
                  const p = (y*BIG + x) * 4;
                  sr += d[p];
                  sg += d[p+1];
                  sb += d[p+2];
                  n++;

                  tot++;
                  if(edges[y*BIG + x]) edgeCount++;
                }
              }

              const rr = Math.round(sr / n);
              const gg = Math.round(sg / n);
              const bb = Math.round(sb / n);

              avgR[r][c] = rr;
              avgG[r][c] = gg;
              avgB[r][c] = bb;

              const edgeRatio = edgeCount / tot;
              if(edgeRatio > EDGE_RATIO_T){
                next[r][c] = BLACK_HEX;
                continue;
              }

              if(rr > WHITE_T && gg > WHITE_T && bb > WHITE_T){
                next[r][c] = null;
                continue;
              }

              next[r][c] = nearestPaletteHex(rr, gg, bb);
            }
          }

          if(importMode === "simple"){
            // contour duidelijker
            next = dilateBlack(next);

            // minder kleuren, maar wel diverser gekozen
            next = reducePalette(next, avgR, avgG, avgB, 5);

            // ruis weg
            next = despeckle(next);

            // maak het rustiger
            next = majoritySmooth(next, 1);

            // contour nog iets sterker
            next = dilateBlack(next);
          }

          if(importMode === "silhouette"){
            // Silhouet: vooral herkenbare omtrek en 1 tot 2 vulkleuren
            next = dilateBlack(next);
            next = reducePalette(next, avgR, avgG, avgB, 3);
            next = majoritySmooth(next, 2);
            next = despeckle(next);
            next = dilateBlack(next);
          }

          grid = next;
          draw();
        } finally {
          try{ URL.revokeObjectURL(url); } catch {}
        }
      };

      img.onerror = () => {
        try{ URL.revokeObjectURL(url); } catch {}
        alert("Deze foto lukt niet");
      };

      img.src = url;
    }

    beadScale.addEventListener("input", () => {
      beadPx = Number(beadScale.value);
      draw();
    });

    clearBtn.addEventListener("click", clearAll);
    undoBtn.addEventListener("click", undo);
    eraserBtn.addEventListener("click", toggleEraser);
    exportBtn.addEventListener("click", exportPNG);
    printBtn.addEventListener("click", printBoard);
    saveBtn.addEventListener("click", save);
    loadBtn.addEventListener("click", () => load());
    homeBtn.addEventListener("click", newDesign);

    zoomRange.addEventListener("input", () => setZoom(Number(zoomRange.value)));
    zoomOutBtn.addEventListener("click", () => setZoom(zoom - 0.1));
    zoomInBtn.addEventListener("click", () => setZoom(zoom + 0.1));
    zoomResetBtn.addEventListener("click", () => setZoom(1));

    helpBtn.addEventListener("click", showHelp);

    importModeBtn.addEventListener("click", toggleImportMode);

    importBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      importImageFile(file);
      fileInput.value = "";
    });

    canvas.addEventListener("pointerdown", onPointerDown, { passive: false });
    canvas.addEventListener("pointermove", onPointerMove, { passive: false });
    canvas.addEventListener("pointerup", onPointerUp);
    canvas.addEventListener("pointercancel", onPointerUp);

    const savedTitle = localStorage.getItem(STORAGE_KEY + "_title");
    if(savedTitle && !designTitleInput.value) designTitleInput.value = savedTitle;
    designTitleInput.addEventListener("input", () => {
      try{ localStorage.setItem(STORAGE_KEY + "_title", designTitleInput.value); } catch {}
    });

    buildPalette();
    applyZoom();
    draw();

    // laad laatste ontwerp
    load();

  })();
  </script>
